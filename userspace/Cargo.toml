# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Cargo workspace for the RPBridge userspace tree.
#
# Member crates:
#   - rpbridge-protocol  : no_std-capable RPBP v1 framing + per-
#                          subsystem wire builders/parsers; shared
#                          ground truth for every userspace binding.
#                          Covers all 11 RPBP subsystems (sys, gpio,
#                          i2c, spi, pwm, adc, uart, led, dmx,
#                          onewire, i2s).
#   - rpbridge           : high-level client (libusb / nusb backend,
#                          capability discovery, per-bus handles).
#   - rpbridge-ctl       : the user-facing CLI.
#   - rpbridge-bench     : latency + throughput benchmarking harness.

[workspace]
resolver = "2"
members = [
    "rpbridge-protocol",
    "rpbridge",
    "rpbridge-ctl",
    "rpbridge-bench",
]

[workspace.package]
version       = "0.1.0"
edition       = "2021"
rust-version  = "1.80"
license       = "Apache-2.0 OR MIT"
authors       = ["BAUER GROUP <karl.bauer@bauer-group.com>"]
repository    = "https://github.com/bauer-group/EMB-USBMultiBusBridge"
homepage      = "https://rpbridge.org"
readme        = "README.md"
categories    = ["embedded", "hardware-support"]
# crates.io caps the keywords list at 5 entries — pick the highest-
# value search terms. The full subsystem list is in the per-crate
# description and the README; "rp2350" + "usb" cover discovery, the
# remaining three pick the most common bus types developers reach
# for first.
keywords      = ["usb", "rp2350", "i2c", "spi", "gpio"]

[workspace.dependencies]
# Local members
rpbridge-protocol = { path = "rpbridge-protocol", version = "0.1.0" }
rpbridge          = { path = "rpbridge",          version = "0.1.0" }

# Transport
nusb       = "0.2"
rusb       = "0.9"

# Framing / encoding
byteorder  = "1.5"
crc32c     = "0.6"
ciborium   = "0.2"

# Async + CLI
tokio      = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
anyhow     = "1.0"
thiserror  = "2.0"
clap       = { version = "4.5", features = ["derive", "wrap_help", "env"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Test support
proptest   = "1.5"
pretty_assertions = "1.4"

[profile.release]
opt-level      = 3
lto            = "thin"
codegen-units  = 1
debug          = 1         # keep line-number info for panic backtraces
strip          = "debuginfo"
panic          = "abort"

[profile.dev]
opt-level = 0
debug     = 2
incremental = true
