# SPDX-License-Identifier: Apache-2.0
name: firmware

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'tools/**'
      - '.github/workflows/firmware.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'firmware/**'
      - 'tools/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.board }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        board: [rpbridge_rp2354b, rpbridge_pico2]
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHA layer cache skips the 5-10 min apt + rustup phase on repeat
      # runs. Cache key is derived from Dockerfile contents by buildx,
      # so editing builder.Dockerfile invalidates the cache cleanly.
      - name: Build builder image (cached)
        uses: docker/build-push-action@v6
        with:
          context: tools/docker
          file:    tools/docker/builder.Dockerfile
          tags:    rpbridge-builder:local
          load:    true
          cache-from: type=gha,scope=builder
          cache-to:   type=gha,scope=builder,mode=max

      - name: Build firmware (size-guard runs inline)
        run: tools/build.sh firmware ${{ matrix.board }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          # Short suffix matches firmware/build-all-variants.sh:
          # rpbridge_rp2354b -> rp2354b/, rpbridge_pico2 -> pico2/.
          path: |
            dist/firmware/*/rpbridge-*.uf2
            dist/firmware/*/rpbridge-*.elf
            dist/firmware/*/rpbridge-*.bin
            dist/firmware/*/rpbridge-*.hex
            dist/firmware/*/size.txt
            dist/firmware/*/CHECKSUMS.txt
          if-no-files-found: error
          retention-days: 30
