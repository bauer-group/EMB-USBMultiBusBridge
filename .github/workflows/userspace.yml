# SPDX-License-Identifier: Apache-2.0
name: userspace

on:
  push:
    branches: [main]
    paths:
      - 'userspace/**'
      - 'tools/**'
      - '.github/workflows/userspace.yml'
  pull_request:
    paths:
      - 'userspace/**'
      - 'tools/**'
      - '.github/workflows/userspace.yml'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: userspace-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build builder image (cached)
        uses: docker/build-push-action@v6
        with:
          context: tools/docker
          file:    tools/docker/builder.Dockerfile
          tags:    rpbridge-builder:local
          load:    true
          cache-from: type=gha,scope=builder
          cache-to:   type=gha,scope=builder,mode=max

      - name: cargo fmt + clippy + test
        run: tools/build.sh test

  cross-build:
    name: cross-build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target:
          - { id: x86_64,  flag: --x86_64,  triple: x86_64-unknown-linux-gnu  }
          - { id: aarch64, flag: --aarch64, triple: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build builder image (cached)
        uses: docker/build-push-action@v6
        with:
          context: tools/docker
          file:    tools/docker/builder.Dockerfile
          tags:    rpbridge-builder:local
          load:    true
          cache-from: type=gha,scope=builder
          cache-to:   type=gha,scope=builder,mode=max

      - name: Cross-build CLI
        run: tools/build.sh userspace ${{ matrix.target.flag }}

      - uses: actions/upload-artifact@v4
        with:
          name: rpbridge-ctl-${{ matrix.target.triple }}
          path: dist/userspace/rpbridge-ctl-${{ matrix.target.triple }}
          if-no-files-found: error
          retention-days: 30
