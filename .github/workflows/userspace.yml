# SPDX-License-Identifier: Apache-2.0
name: userspace

on:
  push:
    branches: [main]
    paths:
      - 'userspace/**'
      - '.github/workflows/userspace.yml'
  pull_request:
    paths:
      - 'userspace/**'
      - '.github/workflows/userspace.yml'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: userspace-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt-clippy-test:
    name: fmt + clippy + test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: userspace
    steps:
      - uses: actions/checkout@v4

      - name: Install libudev / libusb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libusb-1.0-0-dev pkg-config

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: userspace

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test (default features)
        run: cargo test --workspace

      - name: cargo test (no default features, protocol only)
        run: cargo test -p rpbridge-protocol --no-default-features

  cross-build:
    name: cross-build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: userspace
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: userspace
          key: ${{ matrix.target }}

      - name: Install cross deps
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libudev-dev libusb-1.0-0-dev pkg-config
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Install native deps
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev pkg-config

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p rpbridge-ctl

      - uses: actions/upload-artifact@v4
        with:
          name: rpbridge-ctl-${{ matrix.target }}
          path: userspace/target/${{ matrix.target }}/release/rpbridge-ctl
          if-no-files-found: error
          retention-days: 30
