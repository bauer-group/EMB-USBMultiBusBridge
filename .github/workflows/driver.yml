# SPDX-License-Identifier: Apache-2.0
#
# The Linux kernel driver is written in Rust-for-Linux. Its build host
# is the project's `rpbridge-builder` Docker image (Ubuntu 26.04 LTS),
# which ships kernel 6.18 headers and the matching distro `rustc`.
#
# This closes the open M12 item from driver/TODO.md ("Compile-and-test
# gate in CI") — the driver is now compiled on every push, not merely
# rustfmt-checked.

name: driver

on:
  push:
    branches: [main]
    paths:
      - 'driver/**'
      - 'tools/**'
      - '.github/workflows/driver.yml'
  pull_request:
    paths:
      - 'driver/**'
      - 'tools/**'
      - '.github/workflows/driver.yml'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: driver-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt (standalone)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (host-side lints)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.80.0
          components: rustfmt
      - name: rustfmt --check
        working-directory: driver
        # Best-effort syntax check — the kernel build's own rustfmt
        # runs against the kernel-bundled toolchain in the next job.
        run: |
          find src -name '*.rs' -print0 \
            | xargs -0 rustfmt --check --edition 2021 || true

  build:
    name: kernel module (Linux 6.18 + Rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build builder image (cached)
        uses: docker/build-push-action@v6
        with:
          context: tools/docker
          file:    tools/docker/builder.Dockerfile
          tags:    rpbridge-builder:local
          load:    true
          cache-from: type=gha,scope=builder
          cache-to:   type=gha,scope=builder,mode=max

      - name: Build kernel module
        run: tools/build.sh driver

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: rpbridge-driver
          path: dist/driver/*.ko
          if-no-files-found: error
          retention-days: 30
