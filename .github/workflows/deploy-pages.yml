# SPDX-License-Identifier: MIT
name: 📚 Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

jobs:
  pages:
    uses: bauer-group/automation-templates/.github/workflows/mkdocs-deploy-pages.yml@main
