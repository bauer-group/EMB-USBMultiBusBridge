# SPDX-License-Identifier: MIT
#
# Dependabot — keep Cargo crates, GitHub Actions and Python docs deps
# up to date without human prompting. GitHub Actions must be pinned to
# commit SHA in workflow files per BAUER GROUP standards; Dependabot
# pumps those SHAs on the regular schedule below.

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "13:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "cargo"
    directory: "/userspace"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "13:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(userspace)"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/docs"
    schedule:
      interval: "monthly"
      time: "13:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(docs)"

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "13:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(firmware)"
