#
# Install hints for the rpbridge module.
#
# - `debug_dump=0` disables kernel-ring-buffer frame dumps (the default).
#   Set to 1 temporarily when diagnosing a bad frame; never leave on in
#   production, RPBP frames can be large and flood dmesg.
#
options rpbridge debug_dump=0

# Ensure the mainline gs_usb driver handles the CAN vendor interface on
# the same composite device. It's loaded automatically on most distros,
# but if a stripped-down initramfs misses it, uncomment the line below
# to force-load during early boot.
# softdep rpbridge pre: gs_usb
