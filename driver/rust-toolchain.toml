# The driver consumes the kernel's *own* Rust toolchain — the chain
# pinned here is only used by out-of-tree host-side lints (`cargo check`
# on the protocol modules, for instance) and for editor tooling
# (rust-analyzer). The real kernel build ignores this file and uses the
# version pinned in the kernel's scripts/min-tool-version.sh.
#
# Keep this roughly in step with the currently supported kernels — at
# the time of writing, Linux 6.13 pins rustc 1.80.

[toolchain]
channel    = "1.80.0"
components = ["rustfmt", "clippy", "rust-src"]
profile    = "minimal"
