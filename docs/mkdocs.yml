site_name:        RPBridge — USB Multi-Bus Bridge
site_description: Documentation for the RPBridge firmware, Linux driver, and userspace tools.
site_author:      BAUER GROUP
site_url:         https://rpbridge.org/

repo_name:        bauer-group/USB-Multi-Bus-Bridge
repo_url:         https://github.com/bauer-group/USB-Multi-Bus-Bridge
edit_uri:         edit/main/docs/

copyright:        Copyright &copy; 2026 BAUER GROUP. Content licensed CC-BY-4.0.

docs_dir: .
site_dir: ../site

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tooltips

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
  - mike:
      version_selector: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.smartsymbols
  - pymdownx.tilde
  - pymdownx.caret

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bauer-group/USB-Multi-Bus-Bridge
    - icon: fontawesome/solid/globe
      link: https://rpbridge.org

nav:
  - Overview:
      - Welcome: index.md
      - Why RPBridge: motivation.md
      - Quickstart: tutorials/quickstart.md
  - Architecture:
      - Overview: architecture/overview.md
      - System topology: architecture/topology.md
      - Security model: architecture/security.md
  - USB protocol (RPBP v1):
      - Specification: protocol/rpbp-v1.md
      - Capability map: protocol/capabilities.md
      - Error codes: protocol/status-codes.md
      - Fragmentation: protocol/fragmentation.md
      - SYS subsystem: protocol/subsystems/sys.md
      - UART subsystem: protocol/subsystems/uart.md
      - I²C subsystem: protocol/subsystems/i2c.md
      - SPI subsystem: protocol/subsystems/spi.md
      - GPIO subsystem: protocol/subsystems/gpio.md
      - PWM subsystem: protocol/subsystems/pwm.md
      - ADC subsystem: protocol/subsystems/adc.md
      - LED subsystem: protocol/subsystems/led.md
      - DMX subsystem: protocol/subsystems/dmx.md
      - 1-Wire subsystem: protocol/subsystems/onewire.md
      - I²S subsystem: protocol/subsystems/i2s.md
  - Firmware:
      - Overview: firmware/overview.md
      - Building & flashing: firmware/build.md
      - OTA update: firmware/ota.md
      - Resource budget: firmware/resource-budget.md
  - Linux driver:
      - Overview: driver/overview.md
      - Building & loading: driver/build.md
      - Subsystem integration: driver/subsystems.md
      - DKMS packaging: driver/dkms.md
  - Hardware:
      - Rev-B design: hardware/rev-b.md
      - Pinout reference: hardware/pinout.md
      - Pin capability matrix: hardware/pin-matrix.md
      - Bring-up log: hardware/bringup-log.md
  - Tutorials:
      - I²C — BME280: tutorials/i2c-bme280.md
      - GPIO with libgpiod: tutorials/gpio-libgpiod.md
      - CAN with SocketCAN: tutorials/can-socketcan.md
  - Reference:
      - Decision records: adr/index.md
      - Glossary: glossary.md
      - Licensing: licensing.md
      - Releases: releases.md
  - Drafts (historical):
      - Architecture draft: drafts/rpbridge-architektur.md
      - Hardware design: drafts/rpbridge-hardware-design.md
      - Driver stack draft: drafts/rpbridge-driver-stack.md
      - Protocol & modern stack: drafts/rpbridge-protocol-and-modern-stack.md
      - CI/CD draft: drafts/rpbridge-cicd.md
      - Windows support: drafts/rpbridge-windows-support.md
